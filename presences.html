<style>:root{
  --home:#136F8C; --away:#C2185B;
  --bg:#eceef1; --panel:#ffffff; --panel2:#f5f6f8; --ink:#1c1c1e; --muted:#6b6b73; --line:rgba(0,0,0,.08);
  --ok:#1f9d55; --ko:#d64545; --maybe:#d89614;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1f1f1f; --panel:#2a2a2c; --panel2:#323235; --ink:#fff; --muted:#a0a0a8; --line:rgba(255,255,255,.09);
    --ok:#34c47a; --ko:#ff6b6b; --maybe:#f2b33d; }
}
:root[data-theme="dark"]{ --bg:#1f1f1f; --panel:#2a2a2c; --panel2:#323235; --ink:#fff; --muted:#a0a0a8; --line:rgba(255,255,255,.09);
  --ok:#34c47a; --ko:#ff6b6b; --maybe:#f2b33d; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent; }
a{ color:var(--home); }
.wrap{ max-width:900px; margin:0 auto; padding:0 14px 40px; }
header.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:10px 0 8px; }
.brand{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.brand h1{ margin:0; font-size:22px; letter-spacing:-.01em; }
.brand .season{ color:var(--muted); font-size:14px; }
nav.tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar{ display:none; }
nav.tabs a{ flex:none; text-decoration:none; color:var(--ink); background:var(--panel); padding:8px 14px; border-radius:999px; font-weight:600; font-size:15px; }
nav.tabs a.on{ background:var(--home); color:#fff; }
h2{ font-size:18px; margin:22px 0 10px; }
.card{ background:var(--panel); border-radius:18px; padding:16px; }
.muted{ color:var(--muted); }
.badge{ display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; vertical-align:middle; }
.b-home{ background:var(--home); color:#fff; }
.b-away{ background:var(--away); color:#fff; }
.b-warn{ background:color-mix(in srgb,var(--maybe) 18%,transparent); color:var(--maybe); }
.b-ko{ background:color-mix(in srgb,var(--ko) 15%,transparent); color:var(--ko); }
.b-ok{ background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px; }
.chips button{ font:inherit; font-size:14px; border:0; background:var(--panel); color:var(--ink); padding:7px 13px; border-radius:999px; cursor:pointer; }
.chips button.on{ background:var(--ink); color:var(--bg); }
button:focus-visible, a:focus-visible{ outline:3px solid var(--home); outline-offset:2px; }
.foot{ margin-top:28px; font-size:14px; color:var(--muted); }
.foot p{ margin:6px 0; }
.scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:18px; background:var(--panel); }
.notice{ background:color-mix(in srgb,var(--maybe) 14%,var(--panel)); border-radius:14px; padding:10px 14px; font-size:14px; margin-top:10px; }

.sum{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
.sum div{ background:var(--panel2); border-radius:12px; padding:10px 6px; text-align:center; }
.sum b{ display:block; font-size:24px; }
.sum span{ font-size:12px; color:var(--muted); }
table{ border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:14px; }
th,td{ padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); }
thead th{ position:sticky; top:0; background:var(--panel); font-size:12px; font-weight:700; vertical-align:bottom; }
th.n, td.n{ position:sticky; left:0; z-index:1; background:var(--panel); text-align:left; padding-left:14px; white-space:nowrap; font-weight:600; min-width:140px; }
thead th.n{ z-index:2; }
td.c{ min-width:46px; }
.c span{ display:inline-flex; width:30px; height:30px; border-radius:9px; align-items:center; justify-content:center; font-weight:800; }
.y{ background:color-mix(in srgb,var(--ok) 20%,transparent); color:var(--ok); }
.x{ background:color-mix(in srgb,var(--ko) 18%,transparent); color:var(--ko); }
.q{ background:color-mix(in srgb,var(--maybe) 22%,transparent); color:var(--maybe); }
.e{ color:var(--muted); }
th.nx, td.nx{ background:color-mix(in srgb,var(--home) 10%,var(--panel)); }
.hl{ display:block; font-size:11px; margin-top:2px; }
tr.tot td{ font-weight:800; border-bottom:0; }
.rate{ font-weight:700; white-space:nowrap; }
.legend{ display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--muted); margin:10px 2px; }
.legend span span{ display:inline-flex; width:22px; height:22px; border-radius:6px; align-items:center; justify-content:center; font-weight:800; margin-right:4px; }
.who{ font-size:14px; margin-top:10px; line-height:1.6; }
</style>

<script>
const DATA = {"matches": [{"serie": "Heren 3B", "num": "H3B-1", "date": "2026-09-10", "time": "21:00", "home": "VC Atlantis Sportief", "away": "VC Clupea", "hall": "W04 Sporthal De Warande, Warandelaan 14B, 9230 Wetteren", "status": "postponed"}, {"serie": "Heren 3B", "num": "H3B-7", "date": "2026-09-15", "time": "21:00", "home": "VC Clupea", "away": "Volley Aaigem", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-18", "date": "2026-09-22", "time": "21:00", "home": "VC Clupea", "away": "Orix-Martinus", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-22", "date": "2026-09-29", "time": "21:00", "home": "KVC Vokajap Ninove B", "away": "VC Clupea", "hall": "N03 Stedelijke sporthal, Parklaan 15, 9400 Ninove", "status": ""}, {"serie": "Heren 3B", "num": "H3B-33", "date": "2026-10-15", "time": "20:30", "home": "Abacus Burst A", "away": "VC Clupea", "hall": "E07 Sporthal Steenberg, Oudenaardesteenweg 458, 9420 Erpe-Mere", "status": "Forait pour Clupea"}, {"serie": "Heren 3B", "num": "H3B-51", "date": "2026-10-29", "time": "21:00", "home": "VC Atlantis Sportief", "away": "VC Clupea", "hall": "W04 Sporthal De Warande, Warandelaan 14B, 9230 Wetteren", "status": ""}, {"serie": "Heren 3B", "num": "H3B-51", "date": "2026-11-17", "time": "21:00", "home": "VC Clupea", "away": "VC Zebra", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-56", "date": "2026-11-28", "time": "18:00", "home": "Lappetem", "away": "VC Clupea", "hall": "L03 Sporthal Durmehal, Sportlaan 2, 9160 Lokeren", "status": ""}, {"serie": "Heren 3B", "num": "H3B-64", "date": "2026-12-01", "time": "21:00", "home": "VC Clupea", "away": "Vo-Znat Buggenhout", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-43", "date": "2026-12-06", "time": "10:00", "home": "VV Rhode 2", "away": "VC Clupea", "hall": "O09 De Kluize, Sportstraat 5, 9860 Scheldewindeke (Oosterzele)", "status": ""}, {"serie": "Heren 3B", "num": "H3B-67", "date": "2026-12-08", "time": "21:00", "home": "VC Clupea", "away": "VC Atlantis Sportief", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-78", "date": "2026-12-17", "time": "20:30", "home": "Volley Aaigem", "away": "VC Clupea", "hall": "E07 Sporthal Steenberg, Oudenaardesteenweg 458, 9420 Erpe-Mere", "status": ""}, {"serie": "Heren 3B", "num": "H3B-83", "date": "2027-01-12", "time": "20:00", "home": "Orix-Martinus", "away": "VC Clupea", "hall": "E08 Sportcentrum Schotte, Kapellekensbaan 8, 9320 Erembodegem", "status": ""}, {"serie": "Heren 3B", "num": "H3B-90", "date": "2027-01-19", "time": "21:00", "home": "VC Clupea", "away": "KVC Vokajap Ninove B", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-101", "date": "2027-02-16", "time": "21:00", "home": "VC Clupea", "away": "Abacus Burst A", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": "Forait pour Clupea"}, {"serie": "Heren 3B", "num": "H3B-112", "date": "2027-03-02", "time": "21:00", "home": "VC Clupea", "away": "VV Rhode 2", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-116", "date": "2027-03-10", "time": "20:30", "home": "VC Zebra", "away": "VC Clupea", "hall": "W04 Sporthal De Warande, Warandelaan 14B, 9230 Wetteren", "status": ""}, {"serie": "Heren 3B", "num": "H3B-123", "date": "2027-03-16", "time": "21:00", "home": "VC Clupea", "away": "Lappetem", "hall": "M11 Sportcentrum Faluintjes Moorsel", "status": ""}, {"serie": "Heren 3B", "num": "H3B-128", "date": "2027-03-27", "time": "19:00", "home": "Vo-Znat Buggenhout", "away": "VC Clupea", "hall": "B07 Sportcentrum, Platteput 14, 9255 BUGGENHOUT", "status": ""}, {"serie": "Heren 3B", "num": "H3B-43", "date": "2026-04-04", "time": "10:00", "home": "VV Rhode 2", "away": "VC Clupea", "hall": "O09 De Kluize, Sportstraat 5, 9860 Scheldewindeke (Oosterzele)", "status": ""}], "pres": {"dates": ["2026-09-10", "2026-09-15", "2026-09-22", "2026-09-29", "2026-10-15", "2026-10-29", "2026-11-17", "2026-11-28", "2026-12-01", "2026-12-06", "2026-12-08", "2026-12-17", "2027-01-12", "2027-01-19", "2027-02-16", "2027-03-02", "2027-03-10", "2027-03-16", "2027-03-27"], "salle": ["Exterieur", "Home", "Home", "Exterieur", "Exterieur", "Exterieur", "Home", "Exterieur", "Home", "Exterieur", "Home", "Exterieur", "Exterieur", "Home", "Home", "Home", "Exterieur", "Home", "Exterieur"], "res": ["annulé", "3-0", "3-0", "", "", "changed from 10-09", "", "", "", "", "", "", "", "", "", "", "", "", ""], "players": [{"name": "Tarek Klouj", "p": [1, 1, 1, 1, 1, 1, 1, null, null, null, null, null, null, null, null, null, null, null, null]}, {"name": "Achref Lengliz", "p": [1, 1, 1, 1, 1, 1, "?", null, null, null, null, null, null, null, null, null, null, null, null]}, {"name": "Islem Mtaallah", "p": [1, 1, 1, 1, 1, 1, 1, null, null, null, null, null, null, null, null, null, null, null, null]}, {"name": "Skander Mtaallah", "p": [1, 1, 1, 1, 1, 1, 1, null, null, null, null, null, null, null, null, null, null, null, null]}, {"name": "Mohamed Khraief", "p": [1, 1, 1, 1, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]}, {"name": "Zied Attia", "p": [1, 1, 1, 1, 1, 0, null, null, null, null, null, null, null, null, null, null, null, null, null]}, {"name": "Nader Attia", "p": [1, 1, 0, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]}, {"name": "Ali Gader", "p": [null, null, 1, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]}]}};
const SNAP = "1er octobre 2026";
const CLUB = "VC Clupea";
let SET = {};
try{ SET = JSON.parse(localStorage.getItem('vs_settings')||'{}')||{}; }catch(e){}
if(SET.homeColor) document.documentElement.style.setProperty('--home', SET.homeColor);
if(SET.awayColor) document.documentElement.style.setProperty('--away', SET.awayColor);
const SHEET = SET.sheetUrl !== undefined ? SET.sheetUrl : "https://docs.google.com/spreadsheets/d/1Bn9pXDo9P2yCf-vW4lnqFUerIFyICed5Gp9ZizYNqAo/edit?usp=sharing";
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const fDate = (s, o) => toD(s).toLocaleDateString('fr-FR', o || { weekday:'short', day:'numeric', month:'short' });
const short = s => { const d = toD(s); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); };
const foot = html => { document.getElementById('foot').innerHTML = html + `<p>Données du fichier « VC_Clupea_volleyscores_be » au ${SNAP}.${SHEET ? ` <a href="${esc(SHEET)}" target="_blank" rel="noopener">Modifier dans Google Sheets</a>` : ''}</p>`; };

const P = DATA.pres;
const opp = {};
DATA.matches.forEach(m => { if(m.date && !opp[m.date]) opp[m.date] = { o: m.home===CLUB ? m.away : m.home, h: m.home===CLUB, st:(m.status||'').toLowerCase() }; });
const idx = P.dates.map((d,i) => i);
const nextI = idx.find(i => toD(P.dates[i]) >= TODAY && P.res[i].toLowerCase() !== 'annulé' && !(opp[P.dates[i]]||{st:''}).st.includes('postpon'));
const sym = v => v===1 ? '<span class="y" aria-label="présent">✓</span>' : v===0 ? '<span class="x" aria-label="absent">✗</span>' : v==='?' ? '<span class="q" aria-label="incertain">?</span>' : '<span class="e" aria-label="pas de réponse">·</span>';
function summary(){
  if(nextI === undefined) return '';
  const vals = P.players.map(p => p.p[nextI]);
  const c = k => vals.filter(v => v===k).length;
  const yes = c(1), no = c(0), maybe = c('?'), none = vals.filter(v => v==null).length;
  const o = opp[P.dates[nextI]] || {};
  const names = k => P.players.filter(p => p.p[nextI]===k).map(p => esc(p.name)).join(', ');
  return `<section class="card" aria-label="Prochain match">
    <div class="muted" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Prochain match</div>
    <div style="font-size:19px;font-weight:800;margin-top:4px">${fDate(P.dates[nextI], {weekday:'long', day:'numeric', month:'long'})} · ${o.h?'contre':'chez'} ${esc(o.o||'')}</div>
    <div class="sum"><div><b style="color:var(--ok)">${yes}</b><span>présents</span></div><div><b style="color:var(--ko)">${no}</b><span>absents</span></div>
      <div><b style="color:var(--maybe)">${maybe}</b><span>incertains</span></div><div><b>${none}</b><span>sans réponse</span></div></div>
    ${yes < 6 ? `<div class="notice">⚠️ Seulement ${yes} joueur${yes>1?'s':''} confirmé${yes>1?'s':''} : il en faut au moins 6 pour jouer.</div>` : `<div class="notice" style="background:color-mix(in srgb,var(--ok) 12%,var(--panel))">✅ ${yes} joueurs confirmés : l'équipe est complète.</div>`}
    <div class="who">${yes?`<b>Présents :</b> ${names(1)}<br>`:''}${maybe?`<b>Incertains :</b> ${names('?')}<br>`:''}${no?`<b>Absents :</b> ${names(0)}<br>`:''}${none?`<b>Sans réponse :</b> ${P.players.filter(p => p.p[nextI]==null).map(p => esc(p.name)).join(', ')}`:''}</div>
  </section>`;
}
function grid(){
  const head = P.dates.map((d,i) => { const o = opp[d] || {}; const r = P.res[i];
    return `<th class="${i===nextI?'nx':''}" scope="col">${short(d)}<span class="hl muted">${o.h?'Dom.':'Ext.'}</span>${r ? `<span class="hl" title="${esc(r)}">${/^\d-\d$/.test(r) ? esc(r) : r.toLowerCase()==='annulé' ? 'annulé' : 'note'}</span>` : ''}</th>`; }).join('');
  const body = P.players.map(p => {
    const done = idx.filter(i => toD(P.dates[i]) < TODAY && P.res[i].toLowerCase() !== 'annulé');
    const pres = done.filter(i => p.p[i]===1).length;
    return `<tr><th class="n" scope="row">${esc(p.name)}</th>${p.p.map((v,i) => `<td class="c${i===nextI?' nx':''}">${sym(v)}</td>`).join('')}
      <td class="rate">${done.length ? Math.round(pres/done.length*100) + ' %' : '–'}<span class="hl muted">${pres}/${done.length}</span></td></tr>`;
  }).join('');
  const tot = P.dates.map((d,i) => `<td class="${i===nextI?'nx':''}">${P.players.filter(p => p.p[i]===1).length}</td>`).join('');
  return `<div class="scroll"><table><thead><tr><th class="n" scope="col">Joueur</th>${head}<th scope="col">Présence<br>matchs joués</th></tr></thead>
    <tbody>${body}<tr class="tot"><td class="n">Total présents</td>${tot}<td></td></tr></tbody></table></div>`;
}
document.getElementById('main').innerHTML = summary() +
  `<h2>Tableau des présences</h2>
   <div class="legend"><span><span class="y">✓</span>Présent</span><span><span class="x">✗</span>Absent</span><span><span class="q">?</span>Incertain</span><span><span class="e">·</span>Pas encore répondu</span></div>` + grid();
foot(`<p>Pour indiquer ta présence, mets 1 (présent), 0 (absent) ou - (incertain) dans le Google Sheets. Le taux de présence compte les matchs déjà joués, hors match annulé.</p>`);

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
