<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f1f1f">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Présences – VC Clupea</title>
<style>:root{
  --home:#136F8C; --away:#C2185B;
  --bg:#eceef1; --panel:#ffffff; --panel2:#f5f6f8; --ink:#1c1c1e; --muted:#6b6b73; --line:rgba(0,0,0,.08);
  --ok:#1f9d55; --ko:#d64545; --maybe:#d89614;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1f1f1f; --panel:#2a2a2c; --panel2:#323235; --ink:#fff; --muted:#a0a0a8; --line:rgba(255,255,255,.09);
    --ok:#34c47a; --ko:#ff6b6b; --maybe:#f2b33d; }
}
:root[data-theme="dark"]{ --bg:#1f1f1f; --panel:#2a2a2c; --panel2:#323235; --ink:#fff; --muted:#a0a0a8; --line:rgba(255,255,255,.09);
  --ok:#34c47a; --ko:#ff6b6b; --maybe:#f2b33d; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent; }
a{ color:var(--home); }
.wrap{ max-width:900px; margin:0 auto; padding:0 14px 40px; }
header.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:10px 0 8px; }
.brand{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.brand h1{ margin:0; font-size:22px; letter-spacing:-.01em; }
.brand .season{ color:var(--muted); font-size:14px; }
nav.tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar{ display:none; }
nav.tabs a{ flex:none; text-decoration:none; color:var(--ink); background:var(--panel); padding:8px 14px; border-radius:999px; font-weight:600; font-size:15px; }
nav.tabs a.on{ background:var(--home); color:#fff; }
h2{ font-size:18px; margin:22px 0 10px; }
.card{ background:var(--panel); border-radius:18px; padding:16px; }
.muted{ color:var(--muted); }
.badge{ display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; vertical-align:middle; }
.b-home{ background:var(--home); color:#fff; }
.b-away{ background:var(--away); color:#fff; }
.b-warn{ background:color-mix(in srgb,var(--maybe) 18%,transparent); color:var(--maybe); }
.b-ko{ background:color-mix(in srgb,var(--ko) 15%,transparent); color:var(--ko); }
.b-ok{ background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px; }
.chips button{ font:inherit; font-size:14px; border:0; background:var(--panel); color:var(--ink); padding:7px 13px; border-radius:999px; cursor:pointer; }
.chips button.on{ background:var(--ink); color:var(--bg); }
button:focus-visible, a:focus-visible{ outline:3px solid var(--home); outline-offset:2px; }
.foot{ margin-top:28px; font-size:14px; color:var(--muted); }
.foot p{ margin:6px 0; }
.scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:18px; background:var(--panel); }
.notice{ background:color-mix(in srgb,var(--maybe) 14%,var(--panel)); border-radius:14px; padding:10px 14px; font-size:14px; margin-top:10px; }

.sync{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; color:var(--muted); margin:10px 2px 0; }
.sync button{ font:inherit; font-size:13px; font-weight:700; border:0; background:var(--panel); color:var(--ink); padding:6px 12px; border-radius:999px; cursor:pointer; }
.sync.err{ color:var(--ko); }
.codeform{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.codeform input{ flex:1; min-width:160px; font:inherit; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); }
.btn{ font:inherit; font-weight:700; border:0; border-radius:12px; padding:11px 16px; cursor:pointer; background:var(--home); color:#fff; }
.btn.ghost{ background:var(--panel2); color:var(--ink); }
.skel{ height:120px; border-radius:18px; background:var(--panel); opacity:.6; animation:sk 1.2s ease-in-out infinite; }
@keyframes sk{ 50%{ opacity:.3; } }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:12px; font-size:15px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; max-width:90vw; text-align:center; }
.toast.show{ opacity:1; }
.ov{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:20;
  padding:0 0 env(safe-area-inset-bottom,0px); }
.ov.show{ display:flex; }
.ov .sheet{ background:var(--panel); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px 16px 22px; }
.ov h3{ margin:0 0 4px; font-size:18px; }
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.choices button{ font:inherit; font-weight:700; font-size:16px; border:0; border-radius:14px; padding:14px; cursor:pointer; background:var(--panel2); color:var(--ink); }
.choices .cy{ background:color-mix(in srgb,var(--ok) 20%,var(--panel2)); color:var(--ok); }
.choices .cx{ background:color-mix(in srgb,var(--ko) 18%,var(--panel2)); color:var(--ko); }
.choices .cq{ background:color-mix(in srgb,var(--maybe) 22%,var(--panel2)); color:var(--maybe); }
.choices button.cur{ outline:3px solid currentColor; }
@media (prefers-reduced-motion: reduce){ .skel{ animation:none; } .toast{ transition:none; } }

.sum{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
.sum div{ background:var(--panel2); border-radius:12px; padding:10px 6px; text-align:center; }
.sum b{ display:block; font-size:24px; }
.sum span{ font-size:12px; color:var(--muted); }
table{ border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:14px; }
th,td{ padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); }
thead th{ position:sticky; top:0; background:var(--panel); font-size:12px; font-weight:700; vertical-align:bottom; }
th.n, td.n{ position:sticky; left:0; z-index:1; background:var(--panel); text-align:left; padding-left:14px; white-space:nowrap; font-weight:600; min-width:140px; }
thead th.n{ z-index:2; }
td.c{ min-width:46px; }
.c span{ display:inline-flex; width:30px; height:30px; border-radius:9px; align-items:center; justify-content:center; font-weight:800; }
.y{ background:color-mix(in srgb,var(--ok) 20%,transparent); color:var(--ok); }
.x{ background:color-mix(in srgb,var(--ko) 18%,transparent); color:var(--ko); }
.q{ background:color-mix(in srgb,var(--maybe) 22%,transparent); color:var(--maybe); }
.e{ color:var(--muted); }
th.nx, td.nx{ background:color-mix(in srgb,var(--home) 10%,var(--panel)); }
.hl{ display:block; font-size:11px; margin-top:2px; }
tr.tot td{ font-weight:800; border-bottom:0; }
.rate{ font-weight:700; white-space:nowrap; }
.legend{ display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--muted); margin:10px 2px; }
.legend span span{ display:inline-flex; width:22px; height:22px; border-radius:6px; align-items:center; justify-content:center; font-weight:800; margin-right:4px; }
.who{ font-size:14px; margin-top:10px; line-height:1.6; }

td.c.ed{ cursor:pointer; }
td.c.ed:hover span{ filter:brightness(1.15); }
td.c.busy span{ opacity:.35; }
.me{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.me .choices{ grid-template-columns:repeat(3,1fr); margin-top:8px; }
.me select{ font:inherit; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); }
</style>
</head><body>
<div class="wrap">
<header class="top">
  <div class="brand"><h1>✅ VC Clupea</h1><span class="season">Heren 3B · 2026-2027</span></div>
  <nav class="tabs" aria-label="Pages"><a href="index.html">Score</a><a href="matchs.html">Matchs</a><a href="presences.html" class="on" aria-current="page">Présences</a><a href="finances.html">Finances</a></nav>
  <div class="sync" id="sync" role="status" aria-live="polite"></div>
</header>
<main id="main"><div class="skel"></div></main>
<div class="foot" id="foot"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="ovs" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>
<script>
const CLUB = "VC Clupea";
const DEFAULT_SYNC = "https://script.google.com/macros/s/AKfycbyr6Y4-Fb4QJBjblDm9sUayJQGzRdO79XzCgdCCONdoG-YsRacCGFNiTbL0DJYv_mnaTA/exec";
let SET = {};
try{ SET = JSON.parse(localStorage.getItem('vs_settings')||'{}')||{}; }catch(e){}
if(SET.homeColor) document.documentElement.style.setProperty('--home', SET.homeColor);
if(SET.awayColor) document.documentElement.style.setProperty('--away', SET.awayColor);
const SYNC = SET.syncUrl || DEFAULT_SYNC;
const SHEET = SET.sheetUrl !== undefined ? SET.sheetUrl : "https://docs.google.com/spreadsheets/d/1Bn9pXDo9P2yCf-vW4lnqFUerIFyICed5Gp9ZizYNqAo/edit?usp=sharing";
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const fDate = (s, o) => toD(s).toLocaleDateString('fr-FR', o || { weekday:'short', day:'numeric', month:'short' });
const short = s => { const d = toD(s); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); };
const $ = id => document.getElementById(id);
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200); }
function openOv(html){ $('ovs').innerHTML = html; $('ov').classList.add('show'); }
function closeOv(){ $('ov').classList.remove('show'); }
$('ov').addEventListener('click', e => { if(e.target.id==='ov' || e.target.closest('[data-close]')) closeOv(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeOv(); });
const foot = html => { $('foot').innerHTML = html + (SHEET ? `<p><a href="${esc(SHEET)}" target="_blank" rel="noopener">Ouvrir le Google Sheets</a></p>` : ''); };

/* ---------- Synchronisation avec Google Sheets ---------- */
let DATA = null, RAW = null, CODE = SET.teamCode || '';
function adapt(j){
  RAW = j;
  DATA = { matches: j.matches.list, info: j.matches.info || {}, pres: j.presence,
    fin: j.finances ? j.finances.ops : [], net: j.finances ? j.finances.net : null,
    roster: j.presence.players.map(p => p.name), updated: j.updated };
}
function saveCache(j){ try{ localStorage.setItem('vs_sync', JSON.stringify(j)); }catch(e){} }
function syncLine(msg, err){
  const el = $('sync'); el.className = 'sync' + (err ? ' err' : '');
  el.innerHTML = `<span>${msg}</span>${CODE ? '<button id="refresh" aria-label="Actualiser">↻ Actualiser</button>' : ''}`;
  const b = $('refresh'); if(b) b.onclick = () => load(true);
}
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : new Date(iso).toLocaleString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); };
function codeForm(msg){
  $('main').innerHTML = `<section class="card"><h2 style="margin-top:0">Code d'équipe</h2>
    <p class="muted" style="margin:0">${msg || "Entre le code d'équipe pour voir les données synchronisées avec le Google Sheets."}</p>
    <form class="codeform" id="cf"><input id="cfi" type="password" autocomplete="current-password" placeholder="Code d'équipe" aria-label="Code d'équipe" required>
    <button class="btn" type="submit">Valider</button></form></section>`;
  $('cf').onsubmit = e => { e.preventDefault(); CODE = $('cfi').value.trim(); SET.teamCode = CODE;
    try{ localStorage.setItem('vs_settings', JSON.stringify(SET)); }catch(e){} load(true); };
  syncLine('Non connecté');
}
async function load(force){
  if(!DATA){ try{ const c = JSON.parse(localStorage.getItem('vs_sync') || 'null'); if(c && c.ok){ adapt(c); render(); syncLine('Dernière version : ' + ago(c.updated)); } }catch(e){} }
  if(!CODE){ codeForm(); return; }
  syncLine('Synchronisation…');
  try{
    const r = await fetch(SYNC + '?code=' + encodeURIComponent(CODE) + '&t=' + Date.now());
    const j = await r.json();
    if(!j.ok){
      if(j.error === 'code'){ CODE = ''; codeForm("Code d'équipe incorrect. Réessaie."); return; }
      throw new Error(j.error);
    }
    saveCache(j); adapt(j); render(); syncLine('Synchronisé ' + ago(j.updated));
  }catch(e){
    if(DATA) syncLine('Hors ligne – dernière version ' + ago(DATA.updated), true);
    else { $('main').innerHTML = `<div class="card">Impossible de joindre le Google Sheets (${esc(e.message || 'réseau')}). Vérifie ta connexion puis touche Actualiser.</div>`; syncLine('Erreur de synchronisation', true); }
  }
}
async function api(body){
  const r = await fetch(SYNC, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ code: CODE }, body)) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'erreur');
  saveCache(j); adapt(j); syncLine('Synchronisé ' + ago(j.updated));
  return j;
}

let ME = ''; try{ ME = localStorage.getItem('vs_me') || ''; }catch(e){}
let P, opp, idx, nextI;
function prep(){
  P = DATA.pres; opp = {};
  DATA.matches.forEach(m => { if(m.date && !opp[m.date]) opp[m.date] = { o: m.home===CLUB ? m.away : m.home, h: m.home===CLUB, st:(m.status||'').toLowerCase() }; });
  idx = P.dates.map((d,i) => i);
  nextI = idx.find(i => toD(P.dates[i]) >= TODAY && (P.res[i]||'').toLowerCase() !== 'annulé' && !(opp[P.dates[i]]||{st:''}).st.includes('postpon'));
}
const sym = v => v===1 ? '<span class="y" aria-label="présent">✓</span>' : v===0 ? '<span class="x" aria-label="absent">✗</span>' : v==='?' ? '<span class="q" aria-label="incertain">?</span>' : '<span class="e" aria-label="pas de réponse">·</span>';
const editable = i => toD(P.dates[i]) >= TODAY;
function summary(){
  if(nextI === undefined) return '';
  const vals = P.players.map(p => p.p[nextI]);
  const c = k => vals.filter(v => v===k).length;
  const yes = c(1), no = c(0), maybe = c('?'), none = vals.filter(v => v==null).length;
  const o = opp[P.dates[nextI]] || {};
  const names = k => P.players.filter(p => p.p[nextI]===k).map(p => esc(p.name)).join(', ');
  const meP = P.players.find(p => p.name === ME);
  const cur = meP ? meP.p[nextI] : undefined;
  const mine = meP ? `<div class="me"><b>${esc(ME)}</b>, tu viens le ${short(P.dates[nextI])} ?
      <div class="choices">
        <button class="cy${cur===1?' cur':''}" data-set="1" data-p="${esc(ME)}" data-i="${nextI}">✓ Présent</button>
        <button class="cq${cur==='?'?' cur':''}" data-set="?" data-p="${esc(ME)}" data-i="${nextI}">? Incertain</button>
        <button class="cx${cur===0?' cur':''}" data-set="0" data-p="${esc(ME)}" data-i="${nextI}">✗ Absent</button>
      </div><div style="margin-top:8px;font-size:13px"><a href="#" id="notme">Ce n'est pas moi</a></div></div>`
    : `<div class="me"><label>Qui es-tu ? <select id="whoami"><option value="">Choisir mon nom…</option>${P.players.map(p => `<option>${esc(p.name)}</option>`).join('')}</select></label>
       <div class="muted" style="font-size:13px;margin-top:6px">Pour répondre en un clic à chaque match.</div></div>`;
  return `<section class="card" aria-label="Prochain match">
    <div class="muted" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Prochain match</div>
    <div style="font-size:19px;font-weight:800;margin-top:4px">${fDate(P.dates[nextI], {weekday:'long', day:'numeric', month:'long'})} · ${o.h?'contre':'chez'} ${esc(o.o||'')}</div>
    <div class="sum"><div><b style="color:var(--ok)">${yes}</b><span>présents</span></div><div><b style="color:var(--ko)">${no}</b><span>absents</span></div>
      <div><b style="color:var(--maybe)">${maybe}</b><span>incertains</span></div><div><b>${none}</b><span>sans réponse</span></div></div>
    ${yes < 6 ? `<div class="notice">⚠️ Seulement ${yes} joueur${yes>1?'s':''} confirmé${yes>1?'s':''} : il en faut au moins 6 pour jouer.</div>` : `<div class="notice" style="background:color-mix(in srgb,var(--ok) 12%,var(--panel))">✅ ${yes} joueurs confirmés : l'équipe est complète.</div>`}
    <div class="who">${yes?`<b>Présents :</b> ${names(1)}<br>`:''}${maybe?`<b>Incertains :</b> ${names('?')}<br>`:''}${no?`<b>Absents :</b> ${names(0)}<br>`:''}${none?`<b>Sans réponse :</b> ${P.players.filter(p => p.p[nextI]==null).map(p => esc(p.name)).join(', ')}`:''}</div>
    ${mine}
  </section>`;
}
function grid(){
  const head = P.dates.map((d,i) => { const o = opp[d] || {}; const r = P.res[i] || '';
    return `<th class="${i===nextI?'nx':''}" scope="col">${short(d)}<span class="hl muted">${o.h?'Dom.':'Ext.'}</span>${r ? `<span class="hl" title="${esc(r)}">${/^\d-\d$/.test(r) ? esc(r) : r.toLowerCase()==='annulé' ? 'annulé' : 'note'}</span>` : ''}</th>`; }).join('');
  const body = P.players.map((p, pi) => {
    const done = idx.filter(i => toD(P.dates[i]) < TODAY && (P.res[i]||'').toLowerCase() !== 'annulé');
    const pres = done.filter(i => p.p[i]===1).length;
    return `<tr><th class="n" scope="row">${esc(p.name)}</th>${p.p.map((v,i) => `<td class="c${i===nextI?' nx':''}${editable(i)?' ed':''}"${editable(i)?` data-cell="${pi}:${i}" tabindex="0" role="button" aria-label="${esc(p.name)} le ${short(P.dates[i])} : modifier"`:''}>${sym(v)}</td>`).join('')}
      <td class="rate">${done.length ? Math.round(pres/done.length*100) + ' %' : '–'}<span class="hl muted">${pres}/${done.length}</span></td></tr>`;
  }).join('');
  const tot = P.dates.map((d,i) => `<td class="${i===nextI?'nx':''}">${P.players.filter(p => p.p[i]===1).length}</td>`).join('');
  return `<div class="scroll"><table><thead><tr><th class="n" scope="col">Joueur</th>${head}<th scope="col">Présence<br>matchs joués</th></tr></thead>
    <tbody>${body}<tr class="tot"><td class="n">Total présents</td>${tot}<td></td></tr></tbody></table></div>`;
}
function render(){
  prep();
  $('main').innerHTML = summary() +
    `<h2>Tableau des présences</h2>
     <div class="legend"><span><span class="y">✓</span>Présent</span><span><span class="x">✗</span>Absent</span><span><span class="q">?</span>Incertain</span><span><span class="e">·</span>Pas encore répondu</span></div>
     <p class="muted" style="font-size:13px;margin:0 2px 10px">Touche une case d'un match à venir pour la modifier. La réponse est enregistrée directement dans le Google Sheets.</p>` + grid();
  const w = $('whoami'); if(w) w.onchange = () => { ME = w.value; try{ localStorage.setItem('vs_me', ME); }catch(e){} render(); };
  const nm = $('notme'); if(nm) nm.onclick = e => { e.preventDefault(); ME = ''; try{ localStorage.removeItem('vs_me'); }catch(e){} render(); };
  foot(`<p>Les réponses sont écrites dans le Google Sheets (1 présent, 0 absent, - incertain). Le taux de présence compte les matchs déjà joués, hors match annulé.</p>`);
}
function picker(pi, i){
  const p = P.players[pi], v = p.p[i];
  openOv(`<h3>${esc(p.name)}</h3><div class="muted">${fDate(P.dates[i], {weekday:'long', day:'numeric', month:'long'})}</div>
    <div class="choices">
      <button class="cy${v===1?' cur':''}" data-set="1" data-p="${esc(p.name)}" data-i="${i}">✓ Présent</button>
      <button class="cx${v===0?' cur':''}" data-set="0" data-p="${esc(p.name)}" data-i="${i}">✗ Absent</button>
      <button class="cq${v==='?'?' cur':''}" data-set="?" data-p="${esc(p.name)}" data-i="${i}">? Incertain</button>
      <button data-set="" data-p="${esc(p.name)}" data-i="${i}">· Effacer</button>
    </div>
    <div class="choices" style="grid-template-columns:1fr"><button data-close>Annuler</button></div>`);
}
async function setPres(name, i, raw){
  const p = P.players.find(x => x.name === name); if(!p) return;
  const value = raw==='1' ? 1 : raw==='0' ? 0 : raw==='?' ? '?' : null;
  const before = p.p[i];
  if(before === value) return;
  p.p[i] = value; render(); closeOv();
  const cell = document.querySelector(`[data-cell="${P.players.indexOf(p)}:${i}"]`); if(cell) cell.classList.add('busy');
  try{
    await api({ action:'setPresence', player:name, date:P.dates[i], value: raw });
    render(); toast('Enregistré dans le Google Sheets ✓');
  }catch(e){
    p.p[i] = before; render();
    toast(e.message==='code' ? "Code d'équipe refusé" : "Échec de l'enregistrement – vérifie ta connexion");
  }
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-set]'); if(s){ setPres(s.dataset.p, +s.dataset.i, s.dataset.set); return; }
  const c = e.target.closest('[data-cell]'); if(c){ const [pi, i] = c.dataset.cell.split(':').map(Number); picker(pi, i); }
});
document.addEventListener('keydown', e => {
  const c = e.target.closest && e.target.closest('[data-cell]');
  if(c && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); const [pi, i] = c.dataset.cell.split(':').map(Number); picker(pi, i); }
});

load();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
